name: Static and unit tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "wheel/**"
      - "runci/**"
  release:
    types:
      - created
      - edited
  schedule:
    # 04:00 every Tuesday morning
    - cron: "0 4 * * 2"

jobs:
  static-checks:
    name: Static tests
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        pyver: ["3.12"]
    uses: Quantinuum/pytket-workflows/.github/workflows/static-checks-wf.yml@v2.0.1
    with:
      os: ${{ matrix.os }}
      pyver: ${{ matrix.pyver }}

  unit-tests:
    name: Unit tests
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        pyver: ["3.10", "3.13"]
    uses: Quantinuum/pytket-workflows/.github/workflows/unit-test-wf.yml@v2.0.1
    with:
      os: ${{ matrix.os }}
      pyver: ${{ matrix.pyver }}

  remote-tests:
    name: Remote Unit tests
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        pyver: ["3.11"]
    uses: Quantinuum/pytket-workflows/.github/workflows/unit-test-remote-wf.yml@v2.0.1
    with:
      os: ${{ matrix.os }}
      pyver: ${{ matrix.pyver }}
    secrets:
      PYTKET_REMOTE_IBM_CLOUD_INSTANCE: ${{ secrets.PYTKET_REMOTE_IBM_CLOUD_INSTANCE }}
      PYTKET_REMOTE_IBM_CLOUD_TOKEN: ${{ secrets.PYTKET_REMOTE_IBM_CLOUD_TOKEN }}

  aer-tests:
    name: Unit tests using the Aer simulators
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - name: Select Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -v -e .[aer]
      - name: Test
        run: |
          pip install pytest hypothesis
          pytest
